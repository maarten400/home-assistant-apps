name: Nod
version: "0.2.0"
slug: nod
description: Self-hosted Nod personal agent server with Ollama auto-discovery
url: https://github.com/n8n-io/nod
arch:
  - amd64
  - aarch64
init: false
hassio_api: true
homeassistant_api: true
host_network: false
map:
  - share:rw
options:
  model_provider: ollama
  ollama_url: "http://host.docker.internal:11434"
  fallback_model: "llama3.1"
  model_base_url: ""
  model_api_key: ""
  model_name: ""
  extra_env: ""
  dry_run: false
schema:
  model_provider: list(ollama|openai-compatible)
  ollama_url: url?
  fallback_model: str?
  model_base_url: url?
  model_api_key: password?
  model_name: str?
  extra_env: str?
  dry_run: bool
ports:
  3000/tcp: 3000
ingress: true
panel_icon: mdi:robot-outline
panel_title: Nod
